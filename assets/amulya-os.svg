<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
  <title id="title">AMULYA.OS</title>
  <desc id="desc">Amulya Gupta, AI and MLOps engineer. An animated signal travels through retrieval, reasoning, evaluation, production, and observation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".52" stop-color="#0b1020"/><stop offset="1" stop-color="#160d24"/></linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#34d399"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.sans{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.node{fill:#0c1728;stroke:#263750}.nodeText{fill:#91a4bf;font-size:11px;letter-spacing:1.5px}.pulse{animation:pulse 2.4s ease-in-out infinite;transform-origin:center}.blink{animation:blink 1.3s steps(2,end) infinite}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.pulse,.blink{animation:none}}
    </style>
  </defs>
  <rect width="1000" height="400" rx="24" fill="url(#bg)"/><rect width="1000" height="400" rx="24" fill="url(#grid)"/><rect x="1" y="1" width="998" height="398" rx="23" fill="none" stroke="#2c3f5d"/>
  <circle cx="42" cy="35" r="5" fill="#ff6b6b"/><circle cx="60" cy="35" r="5" fill="#fbbf24"/><circle cx="78" cy="35" r="5" fill="#34d399"/>
  <text x="500" y="39" text-anchor="middle" class="mono" fill="#60738f" font-size="11" letter-spacing="2">AMULYA.OS / INTELLIGENCE CONTROL ROOM</text><circle cx="928" cy="35" r="4" fill="#34d399" class="pulse" filter="url(#glow)"/><text x="941" y="39" class="mono" fill="#6ee7b7" font-size="10">ONLINE</text><path d="M24 62H976" stroke="#24334b"/>
  <text x="64" y="120" class="mono" fill="#22d3ee" font-size="13" letter-spacing="3">AI / MLOPS / RETRIEVAL</text><text x="62" y="178" class="sans" fill="#f4f7fb" font-size="45" font-weight="750">Amulya Gupta</text><text x="64" y="216" class="sans" fill="#a9b8cc" font-size="18">I engineer AI systems built for production.</text><text x="64" y="255" class="mono" fill="#657995" font-size="13">$ build --intelligence --trust --repeat</text>
  <rect x="64" y="279" width="312" height="38" rx="8" fill="#0a2130" stroke="#1d6673"/><text x="83" y="303" class="mono" fill="#67e8f9" font-size="12">CURRENT MISSION: RETRIEVALOPS</text><rect x="64" y="338" width="223" height="2" fill="url(#signal)"/><text x="64" y="365" class="mono" fill="#5f728d" font-size="10">BUILD THE INTELLIGENCE. ENGINEER THE TRUST.<tspan class="blink">_</tspan></text>
  <path id="route" d="M505 118C560 80 605 158 659 118S760 80 817 118S902 162 937 120" fill="none" stroke="#29415c" stroke-width="2"/><path d="M505 118C560 80 605 158 659 118S760 80 817 118S902 162 937 120" fill="none" stroke="url(#signal)" stroke-opacity=".45" stroke-width="2" stroke-dasharray="5 8"/>
  <circle r="5" fill="#67e8f9" filter="url(#glow)"><animateMotion dur="4.5s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>
  <g transform="translate(486 155)"><rect class="node" width="104" height="64" rx="10"/><circle cx="18" cy="18" r="4" fill="#34d399" class="pulse"/><text x="52" y="39" text-anchor="middle" class="mono nodeText">RETRIEVE</text></g>
  <g transform="translate(606 155)"><rect class="node" width="104" height="64" rx="10"/><circle cx="18" cy="18" r="4" fill="#22d3ee" class="pulse" style="animation-delay:.35s"/><text x="52" y="39" text-anchor="middle" class="mono nodeText">REASON</text></g>
  <g transform="translate(726 155)"><rect class="node" width="104" height="64" rx="10"/><circle cx="18" cy="18" r="4" fill="#a78bfa" class="pulse" style="animation-delay:.7s"/><text x="52" y="39" text-anchor="middle" class="mono nodeText">EVALUATE</text></g>
  <g transform="translate(846 155)"><rect class="node" width="104" height="64" rx="10"/><circle cx="18" cy="18" r="4" fill="#fb7185" class="pulse" style="animation-delay:1.05s"/><text x="52" y="39" text-anchor="middle" class="mono nodeText">SHIP</text></g>
  <g transform="translate(486 248)"><rect width="464" height="93" rx="12" fill="#081321" stroke="#263750"/><text x="18" y="25" class="mono" fill="#637690" font-size="10" letter-spacing="1.5">LIVE TELEMETRY</text><path d="M18 66L55 66 72 48 94 78 117 57 143 61 163 37 186 65 213 65 232 52 254 69 278 46 302 60 326 60 345 40 368 68 394 55 446 55" fill="none" stroke="url(#signal)" stroke-width="2"/><path d="M18 81H446" stroke="#1e3047" stroke-dasharray="2 5"/><circle cx="446" cy="55" r="4" fill="#a78bfa" class="pulse" filter="url(#glow)"/></g>
</svg>
