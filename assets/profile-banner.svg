  <text x="70" y="142" fill="#EAF2FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="54" font-weight="700" letter-spacing="-1.5">I teach AI systems to survive</text>
  <text x="70" y="204" fill="url(#signal)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="54" font-weight="700" letter-spacing="-1.5">contact with production.</text>

